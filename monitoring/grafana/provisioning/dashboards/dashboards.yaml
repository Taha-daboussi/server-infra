apiVersion: 1

providers:
  - name: server
    folder: Server
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards/server

  - name: apps
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards/apps
      foldersFromFilesStructure: true
